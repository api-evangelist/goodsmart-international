name: GoodsMart International
description: GoodsMart is a Cairo-based premium grocery and household e-commerce delivery startup serving
  compounds across 6th of October, Sheikh Zayed, and New Cairo. Founded by Rami Fawzi and co-founders
  (soft-launched 2014, officially launched 2015), it pioneered contactless overnight grocery delivery in
  Egypt, dropping orders into a pre-installed GoodsMart box outside the customer's home between midnight
  and 6am. The company operates a consumer-facing mobile app and web storefront for groceries, personal
  care, and home-care products. It has raised roughly $4.37M from investors including 500 Global, Sawari
  Ventures, Algebra Ventures, and Savour Ventures. As of this profile, GoodsMart publishes no public
  developer API, documentation, or developer portal; this remains a company/lead record in the API
  Evangelist network rather than an API provider.
